name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish protoc-gen-omnibuf & conformance-runner Release Assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Run CI checks
        run: just ci

      - name: Build cross-platform release archives
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          targets=(
            "darwin:arm64:tar.gz"
            "darwin:amd64:tar.gz"
            "linux:arm64:tar.gz"
            "linux:amd64:tar.gz"
            "windows:amd64:zip"
          )
          binaries=(
            "protoc-gen-omnibuf"
            "conformance-runner"
          )
          for name in "${binaries[@]}"; do
            for target in "${targets[@]}"; do
              IFS=":" read -r goos goarch ext <<< "$target"
              bin="$name"
              if [[ "$goos" == "windows" ]]; then
                bin="${name}.exe"
              fi
              stage="dist/${name}-${VERSION}-${goos}-${goarch}"
              mkdir -p "$stage"
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "$stage/$bin" "./cmd/$name"
              cp LICENSE README.md "$stage/"
              if [[ "$ext" == "zip" ]]; then
                (cd dist && zip -qr "${name}-${goos}-${goarch}.zip" "$(basename "$stage")")
              else
                tar -C dist -czf "dist/${name}-${goos}-${goarch}.tar.gz" "$(basename "$stage")"
              fi
              rm -rf "$stage"
            done
          done
          (cd dist && sha256sum protoc-gen-omnibuf-* conformance-runner-* > checksums.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
